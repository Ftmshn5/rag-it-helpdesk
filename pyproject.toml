[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E4", "E7", "E9",  # pycodestyle: sözdizimi ve ifade hataları
    "F",               # pyflakes: kullanılmayan import/değişken, tanımsız ad
    "I",               # import sırası
    "ANN",             # tip ipucu zorunluluğu (CLAUDE.md: tüm metotlarda type hint)
]

[tool.ruff.lint.per-file-ignores]
# Testlerde fixture ve parametrize fonksiyonlarına tip yazmak kural değil
"tests/**" = ["ANN"]
"migrations/**" = ["ANN"]
