[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# Test kapsamı: pytest --cov (CI her çalıştırmada raporlar)
[tool.coverage.run]
source = ["app"]
branch = true  # yalnızca satır değil, if/else dallarının da çalışıp çalışmadığı

[tool.coverage.report]
show_missing = true
skip_covered = true
# Elle çalıştırılan komut satırı giriş noktaları (seed, indeksleme, kalibrasyon) testlerde çağrılmaz
exclude_also = ['if __name__ == "__main__":']
# Kapsam bu değerin altına düşerse CI başarısız olur (bugün %93)
fail_under = 90

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E4", "E7", "E9",  # pycodestyle: sözdizimi ve ifade hataları
    "F",               # pyflakes: kullanılmayan import/değişken, tanımsız ad
    "I",               # import sırası
    "ANN",             # tip ipucu zorunluluğu (CLAUDE.md: tüm metotlarda type hint)
]

[tool.ruff.lint.per-file-ignores]
# Testlerde fixture ve parametrize fonksiyonlarına tip yazmak kural değil
"tests/**" = ["ANN"]
"migrations/**" = ["ANN"]
